name: Paper build

on:
  pull_request:
    branches: ["main"]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  push:
    branches: ["main"]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal LaTeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 120s sudo apt-get -o Acquire::Retries=3 update
          timeout 360s sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends             latexmk             texlive-latex-base             texlive-latex-recommended

      - name: Build semantic-continuity manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error psl_paper.tex

      - name: Upload paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: psl-paper
          path: paper/psl_paper.pdf
