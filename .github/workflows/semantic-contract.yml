name: Python semantic contract

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["repair/verification-contract"]
  workflow_dispatch:

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run semantic contract tests
        run: python -m unittest discover -v -s tests
